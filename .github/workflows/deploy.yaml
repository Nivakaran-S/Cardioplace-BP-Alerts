name: Deploy to HuggingFace Space

# Workflows only run from .github/workflows/ — a file at .github/deploy.yaml is
# never picked up by Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Set these as repository secrets under Settings -> Secrets and variables -> Actions.
      #   HF_TOKEN     a HuggingFace access token with WRITE permission
      #   HF_USERNAME  the account or org that owns the Space
      #   HF_SPACE     the Space name (not the full URL)
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      HF_SPACE: ${{ secrets.HF_SPACE }}

    steps:
      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.HF_TOKEN }}" ] && missing="$missing HF_TOKEN"
          [ -z "${{ secrets.HF_USERNAME }}" ] && missing="$missing HF_USERNAME"
          [ -z "${{ secrets.HF_SPACE }}" ] && missing="$missing HF_SPACE"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            exit 1
          fi

      # A Space is a deployment target, not a history mirror. Only the current tree
      # is checked out, so only the LFS objects HEAD actually references are fetched.
      # Pushing full history would additionally demand every historical LFS object --
      # including the one the pre-migrate root commit points at, which is a different
      # blob, is not on this runner, and is not needed to run the app.
      - name: Checkout current tree with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify LFS payloads are real content, not pointers
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -c 40 "$f" | grep -q "^version https://git-lfs"; then
              echo "::error::$f is still an LFS pointer -- the Space would get a stub file"
              fail=1
            else
              echo "  ok  $f ($(du -h "$f" | cut -f1))"
            fi
          done < <(git lfs ls-files -n)
          exit $fail

      - name: Build the deploy commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Orphan branch: one root commit holding exactly the current tree. This is
          # what makes the push self-contained -- it references no historical object.
          git checkout --orphan deploy
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}"
          echo "tracked files: $(git ls-files | wc -l)"
          echo "LFS objects:   $(git lfs ls-files | wc -l)"

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          SPACE_URL="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}"
          git remote add space "$SPACE_URL" 2>/dev/null || git remote set-url space "$SPACE_URL"

          # Each deploy replaces the Space's branch with this single commit, so the
          # push is a history rewrite by design rather than a fast-forward.
          git push --force space deploy:main

      - name: Summary
        if: success()
        run: |
          echo "### Deployed to HuggingFace" >> $GITHUB_STEP_SUMMARY
          echo "Space: https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" >> $GITHUB_STEP_SUMMARY
          echo "Source commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
